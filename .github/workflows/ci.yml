name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # An explicit venv on the matrix interpreter. Without `uv venv --python`
      # every leg silently reuses the runner's system Python and the matrix
      # tests nothing; `--system` also fails outright on Debian's
      # externally-managed interpreter.
      - name: Create venv on ${{ matrix.python }}
        run: uv venv --python ${{ matrix.python }}
      - name: Install
        # No `playwright install` here on purpose: the tests never launch a
        # browser, and downloading chromium would add minutes per matrix leg.
        run: uv pip install -e ".[dev]"
      - name: Confirm the interpreter is the one the matrix asked for
        run: .venv/bin/python -c "import sys; assert '.'.join(map(str, sys.version_info[:2])) == '${{ matrix.python }}', sys.version"
      - name: Test
        run: .venv/bin/pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build sdist + wheel
        run: uv build
      - name: Check metadata
        run: uvx twine check dist/*
      - name: Verify the bundled /craft skill ships in the wheel
        # The skill is data, not code — easy to lose to a packaging change
        # and invisible until someone runs `artifold install-skill`.
        run: |
          python - <<'EOF'
          import glob, sys, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = set(zipfile.ZipFile(whl).namelist())
          need = [
              "artifold/template.html",
              "artifold/skills/craft/SKILL.md",
              "artifold/skills/craft/references/modes.md",
              "artifold/skills/craft/references/layouts.md",
              "artifold/skills/craft/references/devices.md",
              "artifold/skills/craft/references/fonts.md",
              "artifold/skills/craft/references/motion.md",
              "artifold/skills/craft/references/craft-recipes.md",
          ]
          missing = [n for n in need if n not in names]
          if missing:
              sys.exit("missing from wheel: " + ", ".join(missing))
          print(f"{whl}: all {len(need)} data files present")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
